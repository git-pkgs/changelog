name: Zizmor

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '**/action.yml'
      - '**/action.yaml'
      - 'zizmor.yml'
      - 'zizmor.yaml'
  pull_request:
    paths:
      - '.github/**'
      - '**/action.yml'
      - '**/action.yaml'
      - 'zizmor.yml'
      - 'zizmor.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
